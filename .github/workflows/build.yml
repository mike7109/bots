name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Gate the build on the network-free unit tests + lint. If this fails, nothing
  # gets built or pushed — the bot's core promise (don't lose a task / don't
  # double-ping) stays covered on every push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e libs/botkit pytest ruff "fastapi>=0.115" "uvicorn[standard]>=0.34"
      - name: Lint
        run: ruff check .
      - name: Config sanity (config.yaml parses)
        run: python -c "import yaml; yaml.safe_load(open('services/gitlab-notify/config.yaml'))"
      - name: Tests
        run: python -m pytest -q
      # ubuntu-latest ships node — syntax-check the extracted admin JS so a broken
      # edit to static/admin.js (now a real file, not an inline string) fails CI.
      - name: Admin JS syntax check
        run: node --check services/gitlab-notify/static/admin.js

  # Figure out which services changed so we only rebuild those (a change under
  # libs/ rebuilds everything that depends on the shared lib).
  changes:
    runs-on: ubuntu-latest
    outputs:
      gitlab-notify: ${{ steps.filter.outputs.gitlab-notify }}
      gitlab-expand-tasks: ${{ steps.filter.outputs.gitlab-expand-tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gitlab-notify:
              - 'services/gitlab-notify/**'
              - 'libs/**'
            gitlab-expand-tasks:
              - 'services/gitlab-expand-tasks/**'
              - 'libs/**'

  build:
    needs: [test, changes]      # tests must pass before anything is built/pushed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # push to GHCR with the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: [gitlab-notify, gitlab-expand-tasks]
    steps:
      # Build when the service changed, or always on a version tag.
      - name: Decide whether to build
        id: go
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ needs.changes.outputs[matrix.service] }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.go.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.go.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.go.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & push
        if: steps.go.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .                                       # repo root: shared libs/ are in scope
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
