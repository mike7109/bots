name: issue-graph

on:
  push:
    branches: [main]
    paths: ["services/issue-graph/**", ".github/workflows/issue-graph.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["services/issue-graph/**"]
  workflow_dispatch:

jobs:
  # Лёгкий гейт: фронт компилируется (tsc), бэкенд импортируется.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/issue-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend typecheck + build
        working-directory: services/issue-graph/frontend
        run: |
          npm install
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend imports
        working-directory: services/issue-graph/backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main; print('backend import OK')"

  build:
    needs: check
    # на PR не пушим — только проверяем сборку гейтом; пуш на main/тегах
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/issue-graph
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/issue-graph
          file: services/issue-graph/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
