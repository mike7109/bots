[project]
name = "bots"
version = "0.0.0"
description = "Monorepo for webhook bots and automations (shared botkit lib + per-bot services)"
requires-python = ">=3.12"

# Virtual workspace root: this package ships nothing itself, it just ties the
# members together so services can depend on `botkit` without publishing it.
[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
botkit = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.pytest.ini_options]
# The gitlab-notify service modules import each other by bare name
# (`import digests`, `from settings import ...`), so its dir must be on the
# path. botkit is installed editable, but listing it here keeps a bare checkout
# (no editable install) working too.
pythonpath = ["services/gitlab-notify", "libs/botkit"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
# CI installs ruff unpinned, and its DEFAULT rule set has grown since this repo
# was written (RUF100/I001/DTZ/UP… are defaults now) — so the lint gate went red
# on 150+ findings in code nobody touched. Pin the rule set explicitly to ruff's
# classic defaults: the gate means the same thing on every ruff version, and
# style opinions land only when we choose to turn them on.
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
