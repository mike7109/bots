# Full stack — runs on the GitLab server. Pulls prebuilt images from GHCR.
#
#   cp gitlab-notify.env.example       gitlab-notify.env        # fill in
#   cp gitlab-expand-tasks.env.example gitlab-expand-tasks.env  # fill in
#   docker compose pull && docker compose up -d
#
# Every service binds 127.0.0.1 only. Point each GitLab webhook at the matching
# localhost port. config.yaml + templates are baked into the image, so updating
# gitlab-notify is just `docker compose pull && up -d`; live wording tweaks go
# through the admin panel's per-template DB overrides (no rebuild, no file sync).
services:
  gitlab-notify:
    image: ghcr.io/mike7109/gitlab-notify:latest
    container_name: gitlab-notify
    restart: unless-stopped
    env_file: ./gitlab-notify.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - gitlab-notify-state:/data            # SQLite: dedup ledger + runtime settings + template overrides (STATE_DB=/data/state.db)
    # Web admin panel at http://127.0.0.1:8081/admin (set ADMIN_PASSWORD in the env file).

  gitlab-expand-tasks:
    image: ghcr.io/mike7109/gitlab-expand-tasks:latest
    container_name: gitlab-expand-tasks
    restart: unless-stopped
    env_file: ./gitlab-expand-tasks.env
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  gitlab-notify-state:                       # persists dedup ledger + runtime settings

# Reminders & digests: the always-on service schedules them itself (per-pass
# days+time in the admin panel), so NO host cron is needed. Manage schedule,
# the «Авторассылки» on/off toggle, and one-off sends from /admin. To use host
# cron instead, turn «Авторассылки» off in /admin and run e.g.
#   0 9 * * 1-5  cd /opt/bots/deploy && docker compose run --rm gitlab-notify python cron.py
