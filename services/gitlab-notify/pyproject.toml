[project]
name = "gitlab-notify"
version = "0.1.0"
description = "GitLab webhook + cron -> Matrix notifications (config-driven)"
requires-python = ">=3.12"
dependencies = [
    "botkit",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
botkit = { workspace = true }

# This is a deployable app, not a library — uv shouldn't try to build it.
[tool.uv]
package = false
