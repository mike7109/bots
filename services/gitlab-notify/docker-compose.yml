# Standalone run for this one bot (the full stack lives in /deploy).
#   cp .env.example .env   # fill in real values
#   IMAGE=ghcr.io/mike7109/gitlab-notify:latest docker compose up -d
#
# config.yaml + templates/ are mounted so you can tweak wording/routing and
# just `docker compose restart` — no rebuild.
services:
  gitlab-notify:
    image: ${IMAGE:-ghcr.io/mike7109/gitlab-notify:latest}
    container_name: gitlab-notify
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./config.yaml:/app/svc/config.yaml:ro
      - ./templates:/app/svc/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
