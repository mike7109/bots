# gitlab-notify — notification types and where they go. Edit this (and
# templates/) without rebuilding the image: it's mounted as a volume.
#
# Secrets and the host-specific room id live in .env. The shared room id comes
# from env MATRIX_ROOM (preferred) and overrides defaults.room_id below, so this
# file stays generic and never diverges per server.

defaults:
  to: [room]                       # default destination(s) if a rule omits `to:`
  room_id: "!SET_VIA_MATRIX_ROOM"  # overridden by env MATRIX_ROOM (no :fakspro.ru suffix)

# gitlab login -> Matrix mxid / display name / email. Used for @-pings and
# (later) email/DM recipients. matrix_domain is the fallback (@<login>:<domain>).
matrix_domain: fakspro.ru
users:
  m.bahmutskij: { matrix: "@m.bahmutskij:fakspro.ru", name: "Михаил Бахмутский" }
  d.nikulin:    { matrix: "@d.nikulin:fakspro.ru",    name: "Никулин Денис" }
  y.belevitnev: { matrix: "@y.belevitnev:fakspro.ru", name: "Ярослав" }
  e.schnaider:  { matrix: "@e.schnaider:fakspro.ru",  name: "Елена" }
  s.staritsyn:  { matrix: "@s.staritsyn:fakspro.ru",  name: "Старицин Сергей" }
  d.tronin:     { matrix: "@d.tronin:fakspro.ru",     name: "Тронин Дмитрий" }

# Each rule = a notification type with its parameters:
#   event / actions  trigger
#   template         look (templates/<template>.matrix.html.j2)
#   to               destination(s): room | dm   (dm = personal direct message)
#   mention          who gets pinged (assignee)
# NB: the key is `event:` (not `on:`) — YAML reads a bare `on` as boolean True.
rules:
  - event: issue                   # webhook: issue opened/closed/reopened (+ update)
    # `update` is here so watched-issue routing (special tags -> group rooms) can
    # render label/edit changes. app.py sends `update` ONLY to watched rooms — the
    # normal source room still gets just open/close/reopen.
    actions: [open, close, reopen, update]
    template: issue
    to: [room]
    mention: assignee

  - event: note                    # webhook: new comment on a watched (special) issue
    actions: [create]              # new comments only (edits/system notes dropped in normalize)
    template: note
    to: [room]                     # app.py forces watch-rooms-only routing for notes
    mention: mentioned             # ping ONLY @-mentioned configured users; never auto-ping assignees

  - event: due_soon                # cron: due tomorrow -> shared room
    template: due_soon
    to: [room]
    mention: assignee

  # Team-facing digests go to the shared room (run from cron, see cron.py):
  - event: digest_team             # cron team: standup overview -> shared room
    template: digest_team
    to: [room]

  - event: triage                  # cron triage: untriaged issues -> shared room
    template: triage
    to: [room]

  - event: stale                   # cron stale: issues idle N days -> shared room
    template: stale
    to: [room]

  - event: metrics                 # cron metrics (weekly): flow snapshot -> room
    template: metrics
    to: [room]

  # --- Personal DMs: present but OFF by default -------------------------------
  # These ship disabled so they show up in the admin panel (Правила) and can be
  # turned on with one toggle — no YAML edit, no restart. When you enable them,
  # the bot DMs assignees (each accepts the bot's invite once, then it's silent).
  - event: overdue                 # cron: due date already passed -> personal DM
    template: overdue
    to: [dm]
    mention: assignee
    enabled: false

  - event: digest_personal         # cron digest: "what's on me" -> personal DM
    template: digest_personal
    to: [dm]
    enabled: false
